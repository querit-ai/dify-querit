identity:
  name: "monitor_executions"
  author: "querit-ai"
  label:
    en_US: "List Executions"
    zh_Hans: "执行历史"
    pt_BR: "Listar Execuções"
    ja_JP: "実行履歴"
description:
  human:
    en_US: "List a monitor's execution records (metadata only, without search results)."
    zh_Hans: "列出监控的执行记录（仅元数据，不含搜索结果）。"
  llm: "List execution records for a Querit monitor by monitor_id, paginated. Returns metadata only (status, duration, new_results); use monitor_executions_recent or monitor_execution_get for the actual results."
parameters:
  - name: monitor_id
    type: string
    required: true
    label:
      en_US: "Monitor ID"
      zh_Hans: "监控 ID"
    human_description:
      en_US: "The monitor id whose executions to list."
      zh_Hans: "要查询执行记录的监控 ID。"
    llm_description: "The monitor id (32-character hexadecimal string)."
    form: llm
  - name: page
    type: number
    required: false
    default: 1
    label:
      en_US: "Page"
      zh_Hans: "页码"
    human_description:
      en_US: "Page number, starting at 1."
      zh_Hans: "页码，从 1 开始。"
    llm_description: "Page number, starting at 1 (optional)."
    form: llm
  - name: page_size
    type: number
    required: false
    default: 20
    label:
      en_US: "Page Size"
      zh_Hans: "每页条数"
    human_description:
      en_US: "Items per page, capped at 100."
      zh_Hans: "每页条数，最大 100。"
    llm_description: "Items per page, max 100 (optional)."
    form: llm
extra:
  python:
    source: tools/monitor_executions.py
